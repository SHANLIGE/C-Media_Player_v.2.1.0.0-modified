<!DOCTYPE html>
<html>
<head>
    <title>Impresión</title>
</head>
<body>

<h1>Impresora</h1>

<button onclick="imprimir()">Imprimir Ticket</button>

<script>
function imprimir() {
   fetch('/print', { method: 'POST' })
  .then(res => res.json())
  .then(console.log)
  .catch(console.error); fetch('http://127.0.0.1:5000/print', {
    method: 'POST'
})
    .then(async res => {
        const text = await res.text();

        try {
            const data = JSON.parse(text);
            alert("Resultado: " + data.status);
        } catch (e) {
            console.error("Respuesta no es JSON:", text);
            alert("Error: respuesta inválida del servidor");
        }
    })
    .catch(err => {
        alert("Error de red: " + err);
    });
}
</script>

</body>
</html>
